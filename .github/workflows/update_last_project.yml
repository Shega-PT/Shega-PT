# Ficheiro: .github/workflows/update_last_project.yml
# Objetivo: Atualizar automaticamente a secção "Último Projeto Trabalhado"
# Frequência: A cada 30 minutos (ou manualmente)

name: Update Last Active Project

on:
  schedule:
    - cron: '*/30 * * * *'  # Executa a cada 30 minutos
  workflow_dispatch:         # Permite execução manual

jobs:
  update-last-project:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permissão para fazer commit no README
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessário para histórico completo

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and update last project
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Token automático do GitHub Actions
          GITHUB_USERNAME: "Shega-PT"
        run: python .github/scripts/update_last_project.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git commit -m "docs: update last active project section" || echo "No changes to commit"
          git push
