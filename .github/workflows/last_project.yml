name: Update Last Active Project

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-last-project:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and update last project
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Shega-PT
        run: |
          python3 -c "
          import requests, os
          from datetime import datetime

          username = os.environ['GITHUB_USERNAME']
          token = os.environ['GITHUB_TOKEN']
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github.v3+json'}

          repos_url = f'https://api.github.com/users/{username}/repos?per_page=100'
          repos = requests.get(repos_url, headers=headers).json()

          last_commit = None
          for repo in repos:
              repo_full_name = repo['full_name']
              if repo_full_name == f'{username}/{username}':
                  continue
              commits_url = f'https://api.github.com/repos/{repo_full_name}/commits?per_page=1'
              commits = requests.get(commits_url, headers=headers).json()
              if not commits:
                  continue
              commit_date = datetime.strptime(commits[0]['commit']['committer']['date'], '%Y-%m-%dT%H:%M:%SZ')
              if last_commit is None or commit_date > last_commit['date']:
                  last_commit = {
                      'date': commit_date,
                      'repo_name': repo['name'],
                      'repo_url': repo['html_url'],
                      'language': repo.get('language', 'N/A'),
                      'commit_msg': commits[0]['commit']['message'].split('\n')[0],
                      'commit_date': commits[0]['commit']['committer']['date'][:10],
                      'description': repo.get('description', 'Sem descrição definida.')
                  }

          if last_commit:
              card_content = f'''
              ### 🛠️ Último Projeto Ativo: [{last_commit["repo_name"]}]({last_commit["repo_url"]})
              * **Linguagem:** `{last_commit["language"]}` | **Data:** {last_commit["commit_date"]}
              * **Último Commit:** `{last_commit["commit_msg"]}`
              > **Descrição:** {last_commit["description"]}
              '''
              with open('README.md', 'r', encoding='utf-8') as f:
                  readme = f.read()
              start_tag = '<!-- START_SECTION:last_project -->'
              end_tag = '<!-- END_SECTION:last_project -->'
              if start_tag in readme and end_tag in readme:
                  new_readme = readme.split(start_tag)[0] + start_tag + '\n' + card_content + '\n' + end_tag + readme.split(end_tag)[1]
                  with open('README.md', 'w', encoding='utf-8') as f:
                      f.write(new_readme)
          "

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git commit -m "docs: update last active project section" || exit 0
          git push
