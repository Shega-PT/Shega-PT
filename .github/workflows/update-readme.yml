name: Update Last Active Project

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-last-project:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Last Active Repository Data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Shega-PT
        run: |
          python3 -c "
          import urllib.request, json, os

          username = os.environ['USERNAME']
          token = os.environ['GH_TOKEN']
          
          req = urllib.request.Request(
              f'https://api.github.com/users/{username}/repos?sort=updated&per_page=1',
              headers={'Authorization': f'token {token}', 'User-Agent': 'Python'}
          )
          repo_data = json.loads(urllib.request.urlopen(req).read())[0]
          repo_name = repo_data['name']
          repo_url = repo_data['html_url']
          description = repo_data['description'] or 'Sem descrição definida.'
          language = repo_data['language'] or 'N/A'
          
          commit_req = urllib.request.Request(
              f'https://api.github.com/repos/{username}/{repo_name}/commits?per_page=1',
              headers={'Authorization': f'token {token}', 'User-Agent': 'Python'}
          )
          commit_data = json.loads(urllib.request.urlopen(commit_req).read())[0]
          commit_msg = commit_data['commit']['message'].split('\n')[0]
          commit_date = commit_data['commit']['committer']['date'][:10]

          card_content = f'''
          ### 🚀 [{repo_name}]({repo_url})
          * **Linguagem:** \`{language}\` | **Data:** {commit_date}
          * **Último Commit:** \`{commit_msg}\`
          > **Descrição:** {description}
          '''

          with open('README.md', 'r', encoding='utf-8') as f:
              readme = f.read()

          start_tag = '<!-- START_SECTION:last_project -->'
          end_tag = '<!-- END_SECTION:last_project -->'
          
          if start_tag in readme and end_tag in readme:
              new_readme = readme.split(start_tag)[0] + start_tag + '\n' + card_content + '\n' + end_tag + readme.split(end_tag)[1]
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(new_readme)
          "

      - name: Commit e Push das Alterações
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "docs: update last active project section" || exit 0
          git push
