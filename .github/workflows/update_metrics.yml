# Ficheiro: .github/workflows/update_metrics.yml
# Objetivo: Atualizar automaticamente a tabela de métricas em "Métricas de Projetos"
# Frequência: Diária (00:00 UTC)

name: Update Project Metrics

on:
  schedule:
    - cron: '0 0 * * *'  # Executa todos os dias às 00:00 UTC
  workflow_dispatch:     # Permite execução manual

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permissão para fazer commit no README
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessário para histórico completo

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Update metrics in README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Token automático do GitHub Actions
          GITHUB_USERNAME: "Shega-PT"
        run: python .github/scripts/update_metrics.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git commit -m "docs: update project metrics" || echo "No changes to commit"
          git push
